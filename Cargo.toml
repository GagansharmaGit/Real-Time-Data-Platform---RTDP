[workspace]
members = [
    "core",
    "transports/udp",
    "cli",
    "conformance",
    "benchmarks",
    "c-abi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RTDP Contributors"]
license = "Apache-2.0"
repository = "https://github.com/rtdp/rtdp"
homepage = "https://rtdp.dev"

[workspace.dependencies]
byteorder = "1.5"
crc32c = "0.6"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.10"
libc = "0.2"
